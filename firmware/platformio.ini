; =============================================================================
; PlatformIO Configuration — Self-Balancing Bike Firmware
; Arduino Uno R3 (ATmega328P), Multi-Environment Build
; =============================================================================
; Cách build/nạp từng môi trường trong VS Code Terminal:
;   python -m platformio run -e main                 (build chương trình chính)
;   python -m platformio run -e main --target upload (nạp chương trình chính)
;   python -m platformio run -e test_hc05            (build test Bluetooth)
;   python -m platformio run -e test_mpu6050         (build test MPU6050)
;   python -m platformio run -e test_nidec           (build test bánh đà 24H)
;   python -m platformio run --target upload -e test_hc05  (nạp test HC-05)
; =============================================================================

[platformio]
; Môi trường mặc định khi chạy `pio run` không kèm -e
default_envs = main

; Cài đặt chung chia sẻ cho tất cả environments
[common]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 9600
build_flags =
    -Wall

; Thư viện dùng chung (nạp từ Registry/GitHub)
lib_deps_common =
    electroniccats/MPU6050@^1.4.0
    arduino-libraries/Servo@^1.2.1

; =============================================================================
; [env:main] — Chương trình chính tích hợp đầy đủ M4–M7
; =============================================================================
[env:main]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = 38400
; Chỉ compile thư mục shared/ và main/ — loại bỏ các thư mục test
build_src_filter =
    +<shared/**>
    +<main/**>
    -<test_hc05/**>
    -<test_mpu6050/**>
    -<test_nidec/**>
lib_deps =
    ${common.lib_deps_common}
build_flags  =
    ${common.build_flags}
    -DBUILD_ENV_MAIN

; =============================================================================
; [env:test_hc05] — Test kết nối Bluetooth HC-05 (độc lập, không dùng shared/)
; =============================================================================
[env:test_hc05]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = 38400
build_src_filter =
    -<shared/**>
    -<main/**>
    +<test_hc05/**>
    -<test_mpu6050/**>
    -<test_nidec/**>
build_flags  =
    ${common.build_flags}
    -DBUILD_ENV_TEST_HC05

; =============================================================================
; [env:test_mpu6050] — Test cảm biến MPU6050 (độc lập)
; =============================================================================
[env:test_mpu6050]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = 9600
build_src_filter =
    -<shared/**>
    -<main/**>
    -<test_hc05/**>
    +<test_mpu6050/**>
    -<test_nidec/**>
lib_deps =
    ${common.lib_deps_common}
build_flags  =
    ${common.build_flags}
    -DBUILD_ENV_TEST_MPU6050

; =============================================================================
; [env:test_nidec] — Test motor bánh đà Nidec 24H055M020 (độc lập)
; =============================================================================
[env:test_nidec]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = 9600
build_src_filter =
    -<shared/**>
    -<main/**>
    -<test_hc05/**>
    -<test_mpu6050/**>
    +<test_nidec/**>
build_flags  =
    ${common.build_flags}
    -DBUILD_ENV_TEST_NIDEC
